<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KETS Developer</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:1100px"><section id="login" class="auth-card" style="margin:70px auto"><img src="/static/kets-logo.svg" style="width:220px"><h1>Developer interface</h1><p class="muted">Private KETS operations area.</p><label>Username<input id="u"></label><label>Password<input id="p" type="password"></label><button class="primary-btn full" onclick="login()">Developer sign in</button><div id="m" class="form-message"></div></section><section id="dash" class="hidden"><div class="hero-card"><div><span class="eyebrow">DEVELOPER ONLY</span><h1>Operations console</h1><p>Signals, accounts and payment records are visible only after developer authentication.</p></div></div><section class="section-head"><div><span class="eyebrow">PRIVATE SIGNALS</span><h2>Latest engine data</h2></div></section><section class="history-card" id="signals"></section><section class="section-head"><div><span class="eyebrow">USERS</span><h2>Accounts</h2></div></section><section class="history-card" id="users"></section><section class="section-head"><div><span class="eyebrow">PAYMENTS</span><h2>Payment records</h2></div></section><section class="history-card" id="payments"></section></section><script>
let token=sessionStorage.getItem("kets_dev_token")||"";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const money=v=>"UGX "+Number(v||0).toLocaleString();
async function login(){try{let r=await fetch("/api/developer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem("kets_dev_token",token);load()}catch(e){m.textContent=e.message}}
async function load(){let r=await fetch("/api/developer/data",{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!r.ok){sessionStorage.removeItem("kets_dev_token");return}login.style.display="none";dash.classList.remove("hidden");signals.innerHTML=d.signals.slice().reverse().map(s=>`<div class="history-row"><div><b>${esc(s.market||s.asset)}</b><div class="history-meta">${esc(s.timestamp||"")}</div></div><div>${esc(s.direction||"WAIT")}</div><div>${esc(s.score??"")}%</div></div>`).join("")||'<div class="empty">No signals</div>';users.innerHTML=d.users.map(x=>`<div class="history-row"><div><b>${esc(x.name||"User")}</b><div class="history-meta">${esc(x.email)}</div></div><div>${esc(x.country_name)} ${esc(x.country_code)}</div><div>${esc(x.created_at)}</div></div>`).join("")||'<div class="empty">No users</div>';payments.innerHTML=d.payments.map(x=>`<div class="history-row"><div><b>${esc(x.plan)}</b><div class="history-meta">${esc(x.email)}</div></div><div>${esc(x.status)}</div><div>${money(x.amount)}</div></div>`).join("")||'<div class="empty">No payments</div>'}
if(token)load();
</script></body></html>

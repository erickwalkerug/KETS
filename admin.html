<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KETS Admin · Payment Approvals</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#eaf1ff;font:15px system-ui,Arial,sans-serif}
main{max-width:1050px;margin:0 auto;padding:24px}.card{background:#101d30;border:1px solid #243650;border-radius:14px;padding:18px;margin:14px 0}
h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}p,.muted{color:#aab9cf}label{display:block;margin:12px 0}input{width:100%;padding:12px;border-radius:8px;border:1px solid #38506f;background:#07101c;color:white}
button{padding:11px 14px;border:0;border-radius:8px;cursor:pointer;background:#3c82f6;color:white;font-weight:700;margin:4px}button.reject{background:#9d3547}button.secondary{background:#34465f}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:220px}.status{font-weight:700}.pending{color:#ffc66d}.good{color:#70e0a1}.bad{color:#ff8a9a}.hidden{display:none}.payment{border-top:1px solid #263950;padding:14px 0}.small{font-size:12px;color:#aab9cf}
</style></head><body><main>
<div class="card"><h1>KETS Admin — Payment Approvals</h1><p>Admin-only controls. Sign in with the deployment admin credentials configured on Render.</p>
<div id="login"><div class="row"><label>Admin username<input id="username" autocomplete="username"></label><label>Admin password<input id="password" type="password" autocomplete="current-password"></label></div><button onclick="login()">Sign in as admin</button></div>
<div id="app" class="hidden"><div class="row"><div><h2>Pending manual payments</h2><p class="muted">Verify the transaction in your bank/mobile-money account before approving.</p></div><div style="text-align:right"><button class="secondary" onclick="load()">Refresh payments</button><button class="secondary" onclick="logout()">Sign out</button></div></div><div id="message"></div><div id="payments">Loading…</div></div></div>
</main><script>
let token="";
async function req(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){const msg=document.getElementById("message");try{const r=await fetch("/api/developer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Sign in failed");token=d.token;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await load()}catch(e){alert(e.message)}}
async function load(){const el=document.getElementById("payments");el.textContent="Loading…";try{const d=await req("/api/developer/data");const pending=(d.payments||[]).filter(p=>p.status==="PENDING_MANUAL");if(!pending.length){el.innerHTML="<p>No pending manual payments.</p>";return}el.innerHTML=pending.map(p=>`<div class="payment"><div class="row"><div><strong>${esc(p.email||"Unknown user")}</strong><p>${esc(p.network||"Manual")} · ${esc(p.currency||"")} ${Number(p.amount||0).toLocaleString()}</p><p>Reference: <strong>${esc(p.tracking_id||"")}</strong></p><p class="small">KETS payment ID: ${esc(p.tx_ref||"")} · Submitted ${esc(p.created_at||"")}</p></div><div><span class="status pending">PENDING REVIEW</span><p>Plan: ${esc(p.plan||"30_days")}</p><button onclick="decide('${esc(p.tx_ref)}','APPROVE')">Approve & activate 30 days</button><button class="reject" onclick="decide('${esc(p.tx_ref)}','REJECT')">Reject</button></div></div></div>`).join("")}catch(e){el.textContent=e.message}}
async function decide(ref,decision){if(!confirm(decision==="APPROVE"?"Confirm you have verified this payment and activate access for 30 days?":"Reject this payment?"))return;try{const d=await req("/api/admin/payments/"+encodeURIComponent(ref)+"/decision",{method:"POST",body:JSON.stringify({decision})});document.getElementById("message").innerHTML='<p class="good">'+esc(d.message)+'</p>';await load()}catch(e){alert(e.message)}}
function logout(){token="";document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>

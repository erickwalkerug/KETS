services:
  - type: web
    name: kets
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # Render Postgres is the permanent cloud store for registered users,
      # profiles, payments, and subscription history.
      - key: DATABASE_URL
        fromDatabase:
          name: kets-db
          property: connectionString
      - key: KETS_SESSION_SECRET
        generateValue: true
      - key: KETS_DISABLE_ENGINE
        value: "1"
      - key: KETS_DISABLE_SOURCE_BRIDGE
        value: "1"
      # Keep the receiver secret configured in Render Dashboard; never commit it.
      - key: KETS_SIGNAL_RECEIVER_KEY
        sync: false

databases:
  - name: kets-db
    databaseName: kets
    user: kets
    plan: free
    # Keep the database in the same Render region as the KETS web service.

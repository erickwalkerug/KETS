services:
  - type: web
    name: kets
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # Supabase PostgreSQL is the permanent cloud store for users,
      # profiles, payments, subscriptions and signals.
      # Set SUPABASE_DB_URL in Render to the Supabase PostgreSQL connection string.
      - key: SUPABASE_DB_URL
        sync: false
      - key: KETS_SESSION_SECRET
        generateValue: true
      - key: KETS_DISABLE_ENGINE
        value: "1"
      # Keep the direct bot -> website POST receiver enabled.
      - key: KETS_DISABLE_SOURCE_BRIDGE
        value: "1"
      # Receiver secret for direct POSTs from the trading bot.
      # Use the same secret as the bot's KETS_API_KEY.
      - key: KETS_SIGNAL_RECEIVER_KEY
        sync: false

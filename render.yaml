services:
  - type: web
    name: kets
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # Render Postgres is the permanent cloud store for registered users,
      # profiles, payments, and subscription history.
      - key: DATABASE_URL
        fromDatabase:
          name: kets-db
          property: connectionString
      - key: KETS_SESSION_SECRET
        generateValue: true
      - key: KETS_DISABLE_ENGINE
        value: "1"
      # Keep the direct bot -> website POST receiver enabled.
      - key: KETS_DISABLE_SOURCE_BRIDGE
        value: "0"
      # The website also pulls the bot's existing 7-day history on startup
      # and periodically so older signals can be imported into Postgres.
      - key: KETS_SIGNAL_SOURCE_URL
        value: "https://my-btc-bot-l0xm.onrender.com"
      # Set this to the same secret used by the trading bot's KETS_API_KEY.
      # Never commit the actual secret.
      - key: KETS_SIGNAL_SOURCE_KEY
        sync: false
      # Receiver secret for direct POSTs from the trading bot.
      # Use the same secret as the bot's KETS_API_KEY.
      - key: KETS_SIGNAL_RECEIVER_KEY
        sync: false

databases:
  - name: kets-db
    databaseName: kets
    user: kets
    plan: free
    # Keep the database in the same Render region as the KETS web service.
